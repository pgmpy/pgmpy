name: Flake8 Incremental Check

on:
  pull_request:
    paths:
      - '**.py'  # Run only when Python files are changed

jobs:
  flake8:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Get modified Python files
        id: files
        run: |
          FILES=$(git diff --name-only origin/main...HEAD | grep '\.py$' | paste -sd' ' -)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Run flake8 on modified files using config file
        run: |
          if [ -n "${{ steps.files.outputs.files }}" ]; then
            echo "Running flake8 on: ${{ steps.files.outputs.files }}"
            flake8 --config=.flake8 ${{ steps.files.outputs.files }}
          else
            echo "No Python files changed."
          fi
