name: Publish Package

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCS_SITE_ROOT: https://pgmpy.org
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build distribution artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build package
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  test-installed-package:
    name: Installed package | Python 3.14
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Print Python info
        run: |
          which python
          python --version

      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Install package from wheel
        run: |
          pip install pytest mock jsonschema
          pip install --upgrade pip
          pip install dist/*.whl

      - name: Print installed packages
        run: pip freeze

      - name: Copy tests to isolated directory
        run: |
          rm -rf /tmp/pgmpy-installed-tests
          mkdir -p /tmp/pgmpy-installed-tests/pgmpy
          mkdir -p /tmp/pgmpy-installed-tests/devtools
          cp pyproject.toml /tmp/pgmpy-installed-tests/pyproject.toml
          cp -r pgmpy/tests /tmp/pgmpy-installed-tests/pgmpy/tests
          cp -r devtools/schema /tmp/pgmpy-installed-tests/devtools/schema

      - name: Run tests against installed package
        working-directory: /tmp/pgmpy-installed-tests
        run: |
          pytest pgmpy/tests

  build-release-docs:
    name: Build release docs
    if: github.event_name == 'release'
    needs: [build, test-installed-package]
    runs-on: ubuntu-latest
    outputs:
      docs_version: ${{ steps.resolve.outputs.docs_version }}
      build_stable_root: ${{ steps.resolve.outputs.build_stable_root }}

    steps:
      - name: Checkout released ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Checkout tutorial notebooks
        uses: actions/checkout@v6
        with:
          repository: pgmpy/pgmpy_tutorials
          path: pgmpy_tutorials

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Resolve release docs metadata
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re

          release_tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", release_tag)
          if match is None:
              raise SystemExit(f"Unsupported release tag format: {release_tag}")

          docs_version = f"v{match.group(1)}.{match.group(2)}"
          manifest = json.loads(pathlib.Path("docs/versions.json").read_text(encoding="utf-8"))
          releases = manifest.get("releases", [])
          stable = manifest.get("stable")

          if docs_version not in releases:
              raise SystemExit(
                  f"Release line {docs_version} is not listed in docs/versions.json. "
                  "Update the manifest before publishing the release."
              )

          build_stable_root = "true" if stable == docs_version else "false"
          github_output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as handle:
              handle.write(f"docs_version={docs_version}\n")
              handle.write(f"build_stable_root={build_stable_root}\n")
          PY

      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install graphviz libgraphviz-dev -y

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .[all]

      - name: Prepare tutorial sources
        run: |
          rm -rf docs/detailed_notebooks docs/csv docs/files docs/images

          if [ -d pgmpy_tutorials/notebooks/detailed_notebooks ]; then
            cp -R pgmpy_tutorials/notebooks/detailed_notebooks docs/detailed_notebooks
          fi

          for path in csv files images; do
            if [ -d "pgmpy_tutorials/${path}" ]; then
              cp -R "pgmpy_tutorials/${path}" "docs/${path}"
            fi
          done

      - name: Build versioned docs
        run: |
          PGMPY_DOCS_TARGET="${{ steps.resolve.outputs.docs_version }}" \
          PGMPY_DOCS_SITE_ROOT="${DOCS_SITE_ROOT}" \
          PGMPY_TUTORIALS_PATH="${GITHUB_WORKSPACE}/pgmpy_tutorials/notebooks" \
          sphinx-build -b html docs docs/_build/release-versioned -W --keep-going

      - name: Build stable docs
        if: steps.resolve.outputs.build_stable_root == 'true'
        run: |
          PGMPY_DOCS_TARGET="stable" \
          PGMPY_DOCS_SITE_ROOT="${DOCS_SITE_ROOT}" \
          PGMPY_TUTORIALS_PATH="${GITHUB_WORKSPACE}/pgmpy_tutorials/notebooks" \
          sphinx-build -b html docs docs/_build/release-stable -W --keep-going

      - name: Upload versioned docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-docs-versioned
          path: docs/_build/release-versioned/

      - name: Upload stable docs artifact
        if: steps.resolve.outputs.build_stable_root == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-docs-stable
          path: docs/_build/release-stable/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [build, test-installed-package]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pgmpy/
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  deploy-release-docs:
    name: Publish release docs
    if: github.event_name == 'release'
    needs: [publish-pypi, build-release-docs]
    runs-on: ubuntu-latest

    steps:
      - name: Download versioned docs artifact
        uses: actions/download-artifact@v8
        with:
          name: release-docs-versioned
          path: built-docs-versioned

      - name: Download stable docs artifact
        if: needs.build-release-docs.outputs.build_stable_root == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-docs-stable
          path: built-docs-stable

      - name: Checkout released ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          path: source
          ref: ${{ github.event.release.tag_name }}

      - name: Checkout documentation site
        uses: actions/checkout@v6
        with:
          repository: pgmpy/pgmpy.github.io
          path: site
          token: ${{ secrets.PGMPY_DOCS_DEPLOY_TOKEN }}

      - name: Publish release docs
        env:
          DOCS_VERSION: ${{ needs.build-release-docs.outputs.docs_version }}
          BUILD_STABLE_ROOT: ${{ needs.build-release-docs.outputs.build_stable_root }}
        run: |
          mkdir -p "site/${DOCS_VERSION}"
          rsync -a --delete built-docs-versioned/ "site/${DOCS_VERSION}/"
          cp source/docs/versions.json site/versions.json

          if [ "${BUILD_STABLE_ROOT}" = "true" ]; then
            if [ -f site/.stable-files ]; then
              while IFS= read -r path; do
                if [ -n "${path}" ]; then
                  rm -f "site/${path}"
                fi
              done < site/.stable-files
            fi

            rsync -a built-docs-stable/ site/
            (
              cd built-docs-stable
              find . -type f | sed 's#^\./##' | sort
            ) > site/.stable-files
          fi

      - name: Commit and push documentation site
        working-directory: site
        env:
          DOCS_VERSION: ${{ needs.build-release-docs.outputs.docs_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --short)" ]; then
            git add -A
            git commit -m "docs: publish ${DOCS_VERSION}"
            git push
          else
            echo "No documentation changes to publish."
          fi

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: [build, test-installed-package]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://test.pypi.org/project/pgmpy/
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
