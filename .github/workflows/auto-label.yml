name: Issue Auto Labeler

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  auto-label:
    runs-on: ubuntu-latest

    steps:
      # Step 1. Get Issue Title
      - name: 1. Get Issue Title
        id: get-title
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            return context.payload.issue.title;

      # Step 2. Get Issue Body
      - name: 2. Get Issue Body
        id: get-body
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            return context.payload.issue.body ?? "";

      # Step 3. Checkout Repository
      - name: 3. Checkout Repository
        uses: actions/checkout@v4

      # Step 4. Setup Python
      - name: 4. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 5-1. Restore GLiClass Model
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-gliclass-small-v1.0-v1

      - name: 5-2. Restore pip Dependencies
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-py311-v1

      # Step 6. Install Dependencies
      - name: 6. Install Dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers gliclass

      # Step 7. Classify Issue
      - name: 7. Classify Issue
        id: classify
        env:
          ISSUE_TITLE: ${{ steps.get-title.outputs.result }}
          ISSUE_BODY: ${{ steps.get-body.outputs.result }}
        run: |
          python .github/scripts/auto-label.py

      # Step 8. Apply Label
      - name: 8. Apply Label
        uses: actions/github-script@v7
        env:
          PREDICTED_LABEL: ${{ steps.classify.outputs.label }}
        with:
          script: |
            const label = process.env.PREDICTED_LABEL;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label]
            });

            console.log(`Applied label: ${label}`);
