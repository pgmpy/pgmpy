name: Read Issue Title

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  read-issue:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Get Issue Title
        id: get-title
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const title = context.payload.issue.title;

            console.log(`Issue Title: ${title}`);

            return title;

      - name: 2. Classify Issue
        id: classify
        env:
          ISSUE_TITLE: ${{ steps.get-title.outputs.result }}
        run: |
          echo "Classifying: $ISSUE_TITLE"

          # TODO: Replace with classification model
          echo "label=Bug" >> "$GITHUB_OUTPUT"

      - name: 3. Apply Label
        uses: actions/github-script@v7
        env:
          PREDICTED_LABEL: ${{ steps.classify.outputs.label }}
        with:
          script: |
            const label = process.env.PREDICTED_LABEL;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label]
            });

            console.log(`Applied label: ${label}`);
