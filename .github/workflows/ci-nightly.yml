name: Test Suite Full

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  test-nosoftdeps:
    name: Core deps | ${{ matrix.os }} | Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest, macOS-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Print Python info
        run: |
          which python
          python --version

      - name: Install graphviz (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install graphviz -y

      - name: Install graphviz (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install graphviz -y

      - name: Install graphviz (macOS)
        if: matrix.os == 'macOS-latest'
        run: brew install graphviz

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest-split
          pip install .[tests]

      - name: Print installed packages
        run: pip freeze

      - name: Run tests
        run: pytest --verbose --junitxml=test-results.xml

  test-fulldep:
    name: Optional deps | ${{ matrix.os }} | Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest, macOS-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Print Python info
        run: |
          which python
          python --version

      - name: Install graphviz (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install graphviz -y

      - name: Install graphviz (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install graphviz -y

      - name: Install graphviz (macOS)
        if: matrix.os == 'macOS-latest'
        run: brew install graphviz

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest-split
          pip install .[all,tests]

      - name: Print installed packages
        run: pip freeze

      - name: Run tests
        run: pytest --cov-config .coveragerc --cov-report html --cov-report term --cov=pgmpy --verbose --junitxml=test-results.xml

      - uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - uses: codecov/test-results-action@v1
        with:
          files: test-results.xml

  notify:
    needs: [test-nosoftdeps, test-fulldep]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Check if an open issue already exists to avoid duplicates
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'nightly-ci-failure',
              state: 'open',
            });

            if (existing.data.length > 0) {
              // Add a comment to the existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Nightly CI failed again on ${date}.\n\n[View run](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Nightly CI failure - ${date}`,
                labels: ['nightly-ci-failure'],
                body: `The nightly CI run failed on ${date}.\n\n[View run](${runUrl})`,
              });
            }
